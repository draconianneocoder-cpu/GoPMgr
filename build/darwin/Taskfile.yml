version: '3'
tasks:
  compile:
    preconditions:
      - test -n "$GOPMGR_BUILD_STAGE"
    cmds:
      - go build {{if eq .GOPMGR_BUILD_DEV "true"}}-gcflags=all=-l{{else}}-tags production -trimpath{{end}} -buildvcs=false -ldflags "{{if ne .GOPMGR_BUILD_DEV "true"}}-w -s {{end}}$GOPMGR_BUILD_LDFLAGS" -o "$GOPMGR_BUILD_STAGE/gopmgr" .
    env:
      CGO_ENABLED: '1'
      GOOS: darwin
      GOARCH: '{{.GOPMGR_BUILD_ARCH}}'
      MACOSX_DEPLOYMENT_TARGET: '26.0'
