# nfpm config — builds .deb and .rpm from the Wails Linux binary.
# https://nfpm.goreleaser.com/
#
# Version comes from the $VERSION env var (set by scripts/package-linux.sh
# or the release workflow — the git tag without the leading "v"). nfpm
# expands ${VERSION} from the environment.
#
# Runtime dependencies match Wails v3.1's standard CGO GTK4 backend.
# Fedora's GTK4/WebKitGTK6 providers are gtk4 and webkitgtk6.0; native
# RPM/minimum-Ubuntu installation qualification is still required.
name: gopmgr
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: The GoPMgr Contributors <contributors@gopmgr.invalid>
vendor: The GoPMgr Contributors
homepage: https://github.com/draconianneocoder-cpu/GoPMgr
license: GPL-3.0-or-later
description: |
  GoPMgr — local-first project controls desktop application.
  Gantt/CPM/EVM scheduling, Six Sigma tools, and encrypted per-project storage.

contents:
  - src: ./build/bin/gopmgr
    dst: /usr/bin/gopmgr
    file_info:
      mode: 0755
  - src: ./build/linux/gopmgr.desktop
    dst: /usr/share/applications/gopmgr.desktop
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/gopmgr.png
  - src: ./LICENSES/GPL-3.0-or-later.txt
    dst: /usr/share/doc/gopmgr/LICENSE
  - src: ./third_party/go-sqlcipher/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/gopmgr/sqlcipher-license.txt
  - src: ./third_party/GO-MODULE-NOTICES.txt
    dst: /usr/share/doc/gopmgr/go-module-notices.txt
  - src: ./third_party/FRONTEND-NOTICES.txt
    dst: /usr/share/doc/gopmgr/frontend-notices.txt
  - src: ./internal/fonts/assets/FONT-NOTICES.txt
    dst: /usr/share/doc/gopmgr/font-notices.txt

overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
