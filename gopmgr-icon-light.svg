GoPMgr App Icon - Light Mode (512x512)
Bobby Beaver mascot inspired by the Go gopher created by Renee French (CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GoPMgr Icon Light - Bobby Beaver">
  <title>GoPMgr App Icon - Light</title>
  <desc>Bobby Beaver looking through magnifying glass at rising chart</desc>

  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="#ECFDF5"/>

    <!-- Network nodes -->
    <g stroke="#6EE7B7" stroke-width="3" fill="#6EE7B7" opacity="0.6">
      <circle cx="380" cy="90" r="8"/>
      <circle cx="430" cy="60" r="6"/>
      <circle cx="420" cy="130" r="6"/>
      <circle cx="460" cy="110" r="5"/>
      <line x1="380" y1="90" x2="430" y2="60"/>
      <line x1="380" y1="90" x2="420" y2="130"/>
      <line x1="420" y1="130" x2="460" y2="110"/>
    </g>

    <!-- Body -->
    <ellipse cx="256" cy="340" rx="140" ry="120" fill="#5B7C99"/>
    <ellipse cx="256" cy="365" rx="95" ry="75" fill="#7BA3C4"/>

    <!-- Feet -->
    <ellipse cx="190" cy="455" rx="35" ry="18" fill="#334155"/>
    <ellipse cx="322" cy="455" rx="35" ry="18" fill="#334155"/>

    <!-- Tail -->
    <path d="M130 360 Q60 340 70 280 Q120 310 150 350 Z" fill="#475569"/>

    <!-- Head -->
    <circle cx="256" cy="200" r="125" fill="#5B7C99"/>

    <!-- Ears -->
    <ellipse cx="160" cy="110" rx="35" ry="42" fill="#5B7C99"/>
    <ellipse cx="160" cy="110" rx="18" ry="22" fill="#FDA4AF"/>
    <ellipse cx="352" cy="110" rx="35" ry="42" fill="#5B7C99"/>
    <ellipse cx="352" cy="110" rx="18" ry="22" fill="#FDA4AF"/>

    <!-- Cheeks -->
    <circle cx="175" cy="220" r="28" fill="#FDA4AF" opacity="0.85"/>
    <circle cx="337" cy="220" r="28" fill="#FDA4AF" opacity="0.85"/>

    <!-- Snout -->
    <ellipse cx="256" cy="245" rx="55" ry="40" fill="#E7D5B8"/>

    <!-- Eyes -->
    <ellipse cx="215" cy="185" rx="28" ry="32" fill="#FFFFFF"/>
    <ellipse cx="297" cy="185" rx="28" ry="32" fill="#FFFFFF"/>
    <circle cx="218" cy="190" r="15" fill="#1E293B"/>
    <circle cx="300" cy="190" r="15" fill="#1E293B"/>
    <circle cx="212" cy="182" r="5" fill="#FFFFFF"/>
    <circle cx="294" cy="182" r="5" fill="#FFFFFF"/>

    <!-- Nose + teeth -->
    <ellipse cx="256" cy="235" rx="14" ry="10" fill="#1E293B"/>
    <rect x="242" y="250" width="12" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="258" y="250" width="12" height="20" rx="3" fill="#FFFFFF"/>

    <!-- Chart on belly area -->
    <rect x="185" y="320" width="140" height="100" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="5"/>
    <rect x="205" y="380" width="20" height="30" fill="#22C55E"/>
    <rect x="235" y="360" width="20" height="50" fill="#F97316"/>
    <rect x="265" y="345" width="20" height="65" fill="#22C55E"/>
    <path d="M210 375 L240 350 L270 335 L300 310" fill="none" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <polygon points="300,310 288,315 305,325" fill="#F97316"/>

    <!-- Magnifying glass in front of face -->
    <circle cx="256" cy="200" r="70" fill="none" stroke="#1E293B" stroke-width="14"/>
    <circle cx="256" cy="200" r="55" fill="#BAE6FD" fill-opacity="0.35"/>
    <path d="M300 245 L340 300" stroke="#1E293B" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
