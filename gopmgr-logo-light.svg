GoPMgr Full Logo - Light Mode
Bobby Beaver mascot inspired by the Go gopher created by Renee French (CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="GoPMgr Logo Light - Bobby Beaver">
  <title>GoPMgr Logo - Light Mode</title>
  <desc>Bobby Beaver examining a rising project chart with magnifying glass, light theme</desc>

  <!-- Soft background -->
  <rect width="800" height="280" rx="24" fill="#F8FAFC"/>

  <!-- Decorative nodes -->
  <g stroke="#86EFAC" stroke-width="2" fill="#86EFAC" opacity="0.7">
    <circle cx="195" cy="48" r="5"/>
    <circle cx="220" cy="32" r="4"/>
    <circle cx="210" cy="70" r="4"/>
    <line x1="195" y1="48" x2="220" y2="32"/>
    <line x1="195" y1="48" x2="210" y2="70"/>
  </g>

  <!-- Beaver body -->
  <ellipse cx="140" cy="195" rx="70" ry="58" fill="#5B7C99"/>
  <ellipse cx="140" cy="208" rx="48" ry="38" fill="#7BA3C4"/>

  <!-- Feet -->
  <ellipse cx="110" cy="250" rx="18" ry="10" fill="#334155"/>
  <ellipse cx="170" cy="250" rx="18" ry="10" fill="#334155"/>

  <!-- Tail -->
  <path d="M75 200 Q40 190 45 160 Q70 175 85 195 Z" fill="#475569"/>
  <path d="M55 175 L70 190 M50 185 L68 200" stroke="#334155" stroke-width="2.5" fill="none"/>

  <!-- Left arm -->
  <path d="M80 175 Q60 190 70 215 Q90 200 95 180 Z" fill="#5B7C99"/>

  <!-- Head -->
  <circle cx="145" cy="115" r="62" fill="#5B7C99"/>

  <!-- Ears -->
  <ellipse cx="100" cy="70" rx="18" ry="22" fill="#5B7C99"/>
  <ellipse cx="100" cy="70" rx="10" ry="12" fill="#FDA4AF"/>
  <ellipse cx="190" cy="70" rx="18" ry="22" fill="#5B7C99"/>
  <ellipse cx="190" cy="70" rx="10" ry="12" fill="#FDA4AF"/>

  <!-- Snout -->
  <ellipse cx="145" cy="135" rx="32" ry="24" fill="#E7D5B8"/>

  <!-- Cheeks -->
  <circle cx="108" cy="125" r="14" fill="#FDA4AF" opacity="0.85"/>
  <circle cx="182" cy="125" r="14" fill="#FDA4AF" opacity="0.85"/>

  <!-- Eyes -->
  <ellipse cx="125" cy="105" rx="13" ry="15" fill="#FFFFFF"/>
  <ellipse cx="165" cy="105" rx="13" ry="15" fill="#FFFFFF"/>
  <circle cx="127" cy="108" r="7" fill="#1E293B"/>
  <circle cx="167" cy="108" r="7" fill="#1E293B"/>
  <circle cx="124" cy="104" r="2.5" fill="#FFFFFF"/>
  <circle cx="164" cy="104" r="2.5" fill="#FFFFFF"/>

  <!-- Nose + teeth -->
  <ellipse cx="145" cy="130" rx="8" ry="6" fill="#1E293B"/>
  <rect x="137" y="138" width="7" height="12" rx="1.5" fill="#FFFFFF"/>
  <rect x="146" y="138" width="7" height="12" rx="1.5" fill="#FFFFFF"/>

  <!-- Chart card -->
  <rect x="185" y="145" width="95" height="85" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
  <!-- chart lines -->
  <line x1="200" y1="162" x2="250" y2="162" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="175" x2="240" y2="175" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bars -->
  <rect x="200" y="200" width="12" height="18" fill="#22C55E"/>
  <rect x="218" y="190" width="12" height="28" fill="#F97316"/>
  <rect x="236" y="178" width="12" height="40" fill="#22C55E"/>
  <!-- trend -->
  <path d="M200 195 L220 182 L240 168 L265 148" fill="none" stroke="#F97316" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="265,148 255,152 268,160" fill="#F97316"/>

  <!-- Right arm + magnifying glass -->
  <path d="M175 165 Q205 155 220 160 Q205 175 185 185 Z" fill="#5B7C99"/>
  <circle cx="225" cy="150" r="22" fill="#BAE6FD" stroke="#1E293B" stroke-width="5"/>
  <path d="M215 140 A 12 12 0 0 1 235 140" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <rect x="238" y="165" width="9" height="28" rx="4" fill="#1E293B" transform="rotate(35 242 179)"/>

  <!-- Wordmark -->
  <text x="310" y="175" font-family="Arial Black, system-ui, sans-serif" font-size="92" font-weight="900" fill="#1E293B" letter-spacing="-4">GoPMgr</text>
</svg>
