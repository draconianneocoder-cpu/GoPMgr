# Generated by tools/module-notices, tools/duckdb-notices and
# frontend/scripts/bundle-notices.mjs: the license and notice texts of the Go
# modules, the code in DuckDB's native libraries and the npm packages in the
# frontend bundle that GoPMgr ships, reproduced verbatim. Each text keeps its own
# terms, so the file takes a LicenseRef that says so. "override" stops REUSE
# from reading the SPDX tags inside the reproduced texts as the file's own.
[[annotations]]
path = [
    "third_party/GO-MODULE-NOTICES.txt",
    "third_party/DUCKDB-NATIVE-NOTICES.txt",
    "third_party/FRONTEND-NOTICES.txt",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 James L. Burns and The GoPMgr Contributors",
    "The copyright holders named in each section of the file",
]
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"

