GoPMgr App Icon - Dark Mode (512x512)
Bobby Beaver mascot inspired by the Go gopher created by Renee French (CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GoPMgr Icon Dark - Bobby Beaver">
  <title>GoPMgr App Icon - Dark</title>
  <desc>Bobby Beaver looking through magnifying glass at rising chart, dark theme</desc>

  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="#0F172A"/>
    <rect width="512" height="512" fill="none" stroke="#22D3EE" stroke-width="10" opacity="0.5"/>

    <!-- Network nodes -->
    <g filter="url(#glow)" stroke="#22D3EE" stroke-width="3" fill="#22D3EE" opacity="0.85">
      <circle cx="380" cy="90" r="8"/>
      <circle cx="430" cy="60" r="6"/>
      <circle cx="420" cy="130" r="6"/>
      <circle cx="460" cy="110" r="5"/>
      <line x1="380" y1="90" x2="430" y2="60"/>
      <line x1="380" y1="90" x2="420" y2="130"/>
      <line x1="420" y1="130" x2="460" y2="110"/>
    </g>

    <!-- Body -->
    <ellipse cx="256" cy="340" rx="140" ry="120" fill="#475569"/>
    <ellipse cx="256" cy="365" rx="95" ry="75" fill="#64748B"/>

    <!-- Feet -->
    <ellipse cx="190" cy="455" rx="35" ry="18" fill="#1E293B"/>
    <ellipse cx="322" cy="455" rx="35" ry="18" fill="#1E293B"/>

    <!-- Tail -->
    <path d="M130 360 Q60 340 70 280 Q120 310 150 350 Z" fill="#334155"/>

    <!-- Head -->
    <circle cx="256" cy="200" r="125" fill="#64748B"/>

    <!-- Ears -->
    <ellipse cx="160" cy="110" rx="35" ry="42" fill="#475569"/>
    <ellipse cx="160" cy="110" rx="18" ry="22" fill="#FB7185"/>
    <ellipse cx="352" cy="110" rx="35" ry="42" fill="#475569"/>
    <ellipse cx="352" cy="110" rx="18" ry="22" fill="#FB7185"/>

    <!-- Cheeks -->
    <circle cx="175" cy="220" r="28" fill="#FB7185" opacity="0.8"/>
    <circle cx="337" cy="220" r="28" fill="#FB7185" opacity="0.8"/>

    <!-- Snout -->
    <ellipse cx="256" cy="245" rx="55" ry="40" fill="#D6BC9A"/>

    <!-- Eyes -->
    <ellipse cx="215" cy="185" rx="28" ry="32" fill="#F1F5F9"/>
    <ellipse cx="297" cy="185" rx="28" ry="32" fill="#F1F5F9"/>
    <circle cx="218" cy="190" r="15" fill="#0F172A"/>
    <circle cx="300" cy="190" r="15" fill="#0F172A"/>
    <circle cx="212" cy="182" r="5" fill="#FFFFFF"/>
    <circle cx="294" cy="182" r="5" fill="#FFFFFF"/>

    <!-- Nose + teeth -->
    <ellipse cx="256" cy="235" rx="14" ry="10" fill="#0F172A"/>
    <rect x="242" y="250" width="12" height="20" rx="3" fill="#F1F5F9"/>
    <rect x="258" y="250" width="12" height="20" rx="3" fill="#F1F5F9"/>

    <!-- Chart -->
    <rect x="185" y="320" width="140" height="100" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-width="5" filter="url(#glow)"/>
    <rect x="205" y="380" width="20" height="30" fill="#34D399"/>
    <rect x="235" y="360" width="20" height="50" fill="#FB923C"/>
    <rect x="265" y="345" width="20" height="65" fill="#34D399"/>
    <path d="M210 375 L240 350 L270 335 L300 310" fill="none" stroke="#FB923C" stroke-width="6" stroke-linecap="round"/>
    <polygon points="300,310 288,315 305,325" fill="#FB923C"/>

    <!-- Magnifying glass -->
    <circle cx="256" cy="200" r="70" fill="none" stroke="#22D3EE" stroke-width="14" filter="url(#glow)"/>
    <circle cx="256" cy="200" r="55" fill="#22D3EE" fill-opacity="0.15"/>
    <path d="M300 245 L340 300" stroke="#22D3EE" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
