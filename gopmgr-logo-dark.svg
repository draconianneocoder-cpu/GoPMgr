GoPMgr Full Logo - Dark Mode
Bobby Beaver mascot inspired by the Go gopher created by Renee French (CC BY 4.0).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="GoPMgr Logo Dark - Bobby Beaver">
  <title>GoPMgr Logo - Dark Mode</title>
  <desc>Bobby Beaver examining a rising project chart with magnifying glass, dark theme with cyan glow</desc>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="24" fill="#0F172A"/>

  <!-- Decorative nodes (glowing) -->
  <g filter="url(#glow)" stroke="#22D3EE" stroke-width="2" fill="#22D3EE" opacity="0.9">
    <circle cx="195" cy="48" r="5"/>
    <circle cx="220" cy="32" r="4"/>
    <circle cx="210" cy="70" r="4"/>
    <line x1="195" y1="48" x2="220" y2="32"/>
    <line x1="195" y1="48" x2="210" y2="70"/>
  </g>

  <!-- Beaver body -->
  <ellipse cx="140" cy="195" rx="70" ry="58" fill="#475569"/>
  <ellipse cx="140" cy="208" rx="48" ry="38" fill="#64748B"/>

  <!-- Feet -->
  <ellipse cx="110" cy="250" rx="18" ry="10" fill="#1E293B"/>
  <ellipse cx="170" cy="250" rx="18" ry="10" fill="#1E293B"/>

  <!-- Tail -->
  <path d="M75 200 Q40 190 45 160 Q70 175 85 195 Z" fill="#334155"/>
  <path d="M55 175 L70 190 M50 185 L68 200" stroke="#1E293B" stroke-width="2.5" fill="none"/>

  <!-- Left arm -->
  <path d="M80 175 Q60 190 70 215 Q90 200 95 180 Z" fill="#475569"/>

  <!-- Head -->
  <circle cx="145" cy="115" r="62" fill="#64748B"/>

  <!-- Ears -->
  <ellipse cx="100" cy="70" rx="18" ry="22" fill="#475569"/>
  <ellipse cx="100" cy="70" rx="10" ry="12" fill="#FB7185"/>
  <ellipse cx="190" cy="70" rx="18" ry="22" fill="#475569"/>
  <ellipse cx="190" cy="70" rx="10" ry="12" fill="#FB7185"/>

  <!-- Snout -->
  <ellipse cx="145" cy="135" rx="32" ry="24" fill="#D6BC9A"/>

  <!-- Cheeks -->
  <circle cx="108" cy="125" r="14" fill="#FB7185" opacity="0.8"/>
  <circle cx="182" cy="125" r="14" fill="#FB7185" opacity="0.8"/>

  <!-- Eyes -->
  <ellipse cx="125" cy="105" rx="13" ry="15" fill="#F1F5F9"/>
  <ellipse cx="165" cy="105" rx="13" ry="15" fill="#F1F5F9"/>
  <circle cx="127" cy="108" r="7" fill="#0F172A"/>
  <circle cx="167" cy="108" r="7" fill="#0F172A"/>
  <circle cx="124" cy="104" r="2.5" fill="#FFFFFF"/>
  <circle cx="164" cy="104" r="2.5" fill="#FFFFFF"/>

  <!-- Nose + teeth -->
  <ellipse cx="145" cy="130" rx="8" ry="6" fill="#0F172A"/>
  <rect x="137" y="138" width="7" height="12" rx="1.5" fill="#F1F5F9"/>
  <rect x="146" y="138" width="7" height="12" rx="1.5" fill="#F1F5F9"/>

  <!-- Chart card -->
  <rect x="185" y="145" width="95" height="85" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="4" filter="url(#glow)"/>
  <line x1="200" y1="162" x2="250" y2="162" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="175" x2="240" y2="175" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="200" y="200" width="12" height="18" fill="#34D399"/>
  <rect x="218" y="190" width="12" height="28" fill="#FB923C"/>
  <rect x="236" y="178" width="12" height="40" fill="#34D399"/>
  <path d="M200 195 L220 182 L240 168 L265 148" fill="none" stroke="#FB923C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="265,148 255,152 268,160" fill="#FB923C"/>

  <!-- Right arm + magnifying glass -->
  <path d="M175 165 Q205 155 220 160 Q205 175 185 185 Z" fill="#64748B"/>
  <circle cx="225" cy="150" r="22" fill="#0F172A" stroke="#22D3EE" stroke-width="5" filter="url(#glow)"/>
  <path d="M215 140 A 12 12 0 0 1 235 140" fill="none" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <rect x="238" y="165" width="9" height="28" rx="4" fill="#0F172A" transform="rotate(35 242 179)"/>

  <!-- Wordmark -->
  <text x="310" y="175" font-family="Arial Black, system-ui, sans-serif" font-size="92" font-weight="900" fill="#F8FAFC" letter-spacing="-4">GoPMgr</text>
</svg>
