# GitHub Actions release pipeline for GoPMgr — click-installable packages.
#
# Wails does not truly cross-compile, so each OS builds on its native runner:
#   Linux (x86_64)        -> .deb + .rpm (nfpm)
#   Windows (x86_64)      -> NSIS .exe installer (wails build -nsis)
#   macOS (Apple Silicon) -> .dmg (drag-to-Applications)
# A final job attaches everything to a GitHub Release.
#
# Code-signing/notarization is OFF (packages install/run but show OS
# "unidentified developer" warnings). The signing hooks live in
# scripts/package-macos.sh and are enabled by adding certs as CI secrets.
#
# Trigger: push a version tag, e.g. `git tag v1.2.0 && git push origin v1.2.0`.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: "1"
  GOPMGR_UPDATE_PUBLIC_KEY: ${{ vars.GOPMGR_UPDATE_PUBLIC_KEY }}

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Tag preflight
    runs-on: ubuntu-24.04
    # Installer jobs must consume only a checkout that passed the complete
    # release gate. This job builds an unshipped Linux smoke artifact; no
    # installer is created or uploaded until the dependent matrix starts.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install release-gate system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config qpdf poppler-utils pipx ripgrep
          # Release-scope and packaging contracts use rg extensively. Check it
          # here so runner-image drift fails as one dependency error instead
          # of producing misleading missing-workflow-literal failures.
          command -v rg >/dev/null

      - name: Install pinned release tools
        # Keep the CLI and licensing tool aligned with the versions used by
        # GoPMgr maintainers; unpinned installers would make a tag's outcome
        # depend on whichever release happened to be newest that day.
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          pipx install reuse==6.2.0
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate tag and run full release gate
        run: PMFORGE_RELEASE_TAG="$GITHUB_REF_NAME" make tag-preflight

  build:
    name: Package ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux/amd64 (.deb/.rpm)
            platform: linux/amd64
          - os: macos-latest
            label: darwin/arm64 (.dmg)
            platform: darwin/arm64
          - os: windows-latest
            label: windows/amd64 (.exe)
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Define signed update-channel build identity
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-alpha.*) channel="alpha" ;;
            *-beta.*) channel="beta" ;;
            *-rc.*) channel="rc" ;;
            *) channel="stable" ;;
          esac
          ldflags="-X gopmgr/internal/update.CurrentVersion=$version -X gopmgr/internal/update.UpdateChannel=$channel"
          if [ -n "$GOPMGR_UPDATE_PUBLIC_KEY" ] && [ "${{ matrix.platform }}" != "linux/amd64" ]; then
            target="${{ matrix.platform }}"
            manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/update-$channel-${target//\//-}.json"
            ldflags="$ldflags -X gopmgr/internal/update.ManifestURL=$manifest_url -X gopmgr/internal/update.UpdateChannelPublicKey=$GOPMGR_UPDATE_PUBLIC_KEY"
          fi
          echo "GOPMGR_RELEASE_LDFLAGS=$ldflags" >> "$GITHUB_ENV"

      - name: Load pinned installer tool versions
        # Only import declared version assignments; SPDX comments remain valid
        # in the source file without becoming malformed GITHUB_ENV entries.
        run: grep -E '^(NFPM_VERSION|NSIS_VERSION)=' scripts/release-tool-versions.env >> "$GITHUB_ENV"

      - name: Install nfpm (Linux .deb/.rpm)
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@"${NFPM_VERSION}"
          # `nfpm --version` reports "dev" for go-install builds. Go's embedded
          # module metadata is the authoritative proof of the selected tag.
          actual_nfpm_version="$(go version -m "$(command -v nfpm)" | awk '$1 == "mod" && $2 == "github.com/goreleaser/nfpm/v2" { print $3 }')"
          test "$actual_nfpm_version" = "$NFPM_VERSION"

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version="${NSIS_VERSION}" -y --no-progress
          # Chocolatey's package record validates the exact moderated package;
          # Git Bash does not inherit Chocolatey's in-process PATH update. Check
          # the explicit installation path, expose it to this shell, and persist
          # the native path for the later Wails step.
          installed_nsis_version="$(choco list --exact nsis --limit-output | tr -d '\r' | awk -F'|' '$1 == "nsis" { print $2 }')"
          test "$installed_nsis_version" = "$NSIS_VERSION"
          nsis_dir="/c/Program Files (x86)/NSIS"
          test -x "$nsis_dir/makensis.exe"
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          export PATH="$nsis_dir:$PATH"
          command -v makensis >/dev/null

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.platform }} -tags duckdb,webkit2_41 -ldflags "$GOPMGR_RELEASE_LDFLAGS"

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        run: wails build -platform ${{ matrix.platform }} -tags duckdb -ldflags "$GOPMGR_RELEASE_LDFLAGS"

      - name: Wails build + NSIS installer (Windows)
        if: runner.os == 'Windows'
        run: |
          # Fail before compilation if source-owned installer branding or its
          # user-data preservation boundary has drifted.
          bash scripts/check-windows-installer-scaffold.sh
          bash scripts/validate-windows-nsis-template.sh
          wails build -platform windows/amd64 -tags duckdb -ldflags "$GOPMGR_RELEASE_LDFLAGS" -nsis
          # The Windows command previously omitted duckdb while other package
          # legs embedded it. Verify metadata before publishing the installer.
          bash scripts/verify-duckdb-linked.sh build/bin/gopmgr.exe

      - name: Reclaim macOS packaging space
        if: runner.os == 'macOS'
        run: |
          # DuckDB's CGO build leaves multi-gigabyte Go caches on a hosted
          # runner. The compiled .app no longer needs them, and hdiutil needs
          # free scratch space to copy and compress the staged application.
          df -h /
          go clean -cache -modcache
          npm cache clean --force
          df -h /

      - name: Package Linux (.deb / .rpm)
        if: runner.os == 'Linux'
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-linux.sh

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        # package-macos.sh intentionally takes its non-interactive hdiutil path.
        # create-dmg is a local opt-in and is not installed on the release runner.
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-macos.sh

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p build/packages
          # Wails writes the NSIS installer to build/bin/*-installer.exe. Pick the
          # newest match explicitly so a missing or ambiguous glob fails loudly
          # instead of producing a cryptic cp error or an empty artifact.
          installer="$(ls -t build/bin/*installer*.exe 2>/dev/null | head -1 || true)"
          if [ -z "$installer" ]; then
            echo "release: no NSIS installer found in build/bin (did 'wails build -nsis' run?)." >&2
            ls -la build/bin >&2 || true
            exit 1
          fi
          cp "$installer" "build/packages/GoPMgr-${GITHUB_REF_NAME#v}-amd64-setup.exe"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: gopmgr-${{ matrix.os }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publish job checks out the reviewed tag so release classification
      # uses the same tested helper that the source preflight validates.
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GOPMGR_UPDATE_PRIVATE_KEY: ${{ secrets.GOPMGR_UPDATE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-alpha.*) channel="alpha" ;;
            *-beta.*) channel="beta" ;;
            *-rc.*) channel="rc" ;;
            *) channel="stable" ;;
          esac
          if [ -n "$GOPMGR_UPDATE_PUBLIC_KEY" ]; then
            test -n "$GOPMGR_UPDATE_PRIVATE_KEY"
            for target in darwin-arm64 windows-amd64; do
              case "$target" in
                darwin-arm64) pattern='*.dmg'; platform=darwin; architecture=arm64 ;;
                windows-amd64) pattern='*.exe'; platform=windows; architecture=amd64 ;;
              esac
              artifact="$(find dist -type f -name "$pattern" -print -quit)"
              test -n "$artifact"
              filename="$(basename "$artifact")"
              go run ./tools/update-manifest \
                -version "$version" -channel "$channel" \
                -platform "$platform" -architecture "$architecture" \
                -artifact "$artifact" \
                -download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$filename" \
                -output "dist/update-$channel-$target.json"
            done
          fi
          publication_flag="$(bash scripts/release-publication-flag.sh "$GITHUB_REF_NAME")"
          publication_args=()
          if [ -n "$publication_flag" ]; then
            publication_args+=("$publication_flag")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GoPMgr $GITHUB_REF_NAME" \
            --generate-notes \
            "${publication_args[@]}" \
            dist/*
