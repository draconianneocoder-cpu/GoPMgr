# Release workflow definition for GoPMgr's Wails v3 migration.
# Run qualification locally; hosted execution/publication remains unauthorized.
# Source packaging does not qualify NSIS 3.12 or native Windows install/upgrade/remove.
#
# Wails does not truly cross-compile, so each OS builds on its native runner:
#   Linux (x86_64)        -> .deb + .rpm (nfpm)
#   Windows (x86_64)      -> NSIS .exe installer (native Windows qualification remains separate)
#   macOS (Apple Silicon) -> .dmg (drag-to-Applications)
# A final job attaches everything to a draft GitHub Release for review.
#
# Code-signing/notarization is OFF (packages install/run but show OS
# "unidentified developer" warnings). The signing hooks live in
# scripts/package-macos.sh and are enabled by adding certs as CI secrets.
#
# Trigger: push a version tag, e.g. `git tag v1.2.0 && git push origin v1.2.0`.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: "1"
  WAILS3: .tmp/wails-v3/bin/wails3
  GOPMGR_UPDATE_PUBLIC_KEY: ${{ vars.GOPMGR_UPDATE_PUBLIC_KEY }}

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Tag preflight
    runs-on: ubuntu-26.04
    # Installer jobs must consume only a checkout that passed the complete
    # release gate. This job builds an unshipped Linux smoke artifact; no
    # installer is created or uploaded until the dependent matrix starts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install release-gate system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config qpdf poppler-utils pipx ripgrep
          # Release-scope and packaging contracts use rg extensively. Check it
          # here so runner-image drift fails as one dependency error instead
          # of producing misleading missing-workflow-literal failures.
          command -v rg >/dev/null

      - name: Install pinned release tools
        # Keep the CLI and licensing tool aligned with the versions used by
        # GoPMgr maintainers; unpinned installers would make a tag's outcome
        # depend on whichever release happened to be newest that day.
        run: |
          mkdir -p .tmp/wails-v3/bin
          GOBIN="$PWD/.tmp/wails-v3/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          # charset-normalizer extra: reuse's mandatory python-magic dep is a
          # ctypes binding to native libmagic, which pip does not ship. This
          # job runs on Linux where libmagic1 is preinstalled, but the extra
          # removes that implicit system dependency so a runner-image change
          # cannot break the release gate at tag time (it already broke the
          # macos-15 CI assurance job for exactly this reason).
          pipx install 'reuse[charset-normalizer]==6.2.0'
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate actual Wails service bindings
        run: GOPMGR_BINDINGS_PRODUCTION=1 bash scripts/wails-v3-qualification.sh generate

      - name: Validate tag and run full release gate
        run: GOPMGR_RELEASE_TAG="$GITHUB_REF_NAME" make tag-preflight

  build:
    name: Package ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            label: linux/amd64 (.deb/.rpm)
            platform: linux/amd64
          - os: macos-latest
            label: darwin/arm64 (.dmg)
            platform: darwin/arm64
          - os: windows-latest
            label: windows/amd64 (.exe)
            platform: windows/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install Wails system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config binutils

      - name: Install pinned Wails v3 CLI
        run: |
          cli_bin="$PWD/.tmp/wails-v3/bin"
          mkdir -p "$cli_bin"
          if [ "$RUNNER_OS" = Windows ]; then cli_bin="$(cygpath -m "$cli_bin")"; fi
          GOBIN="$cli_bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Define signed update-channel build identity
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="$(bash scripts/release-update-channel.sh "$GITHUB_REF_NAME")"
          ldflags="-X gopmgr/internal/update.CurrentVersion=$version -X gopmgr/internal/update.UpdateChannel=$channel"
          if [ -n "$GOPMGR_UPDATE_PUBLIC_KEY" ] && [ "${{ matrix.platform }}" != "linux/amd64" ]; then
            target="${{ matrix.platform }}"
            manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/update-$channel-${target//\//-}.json"
            ldflags="$ldflags -X gopmgr/internal/update.ManifestURL=$manifest_url -X gopmgr/internal/update.UpdateChannelPublicKey=$GOPMGR_UPDATE_PUBLIC_KEY"
          fi
          echo "GOPMGR_RELEASE_LDFLAGS=$ldflags" >> "$GITHUB_ENV"

      - name: Load pinned installer tool versions
        # Only import declared version assignments; SPDX comments remain valid
        # in the source file without becoming malformed GITHUB_ENV entries.
        run: grep -E '^(NFPM_VERSION|NSIS_VERSION)=' scripts/release-tool-versions.env >> "$GITHUB_ENV"

      - name: Install nfpm (Linux .deb/.rpm)
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@"${NFPM_VERSION}"
          # `nfpm --version` reports "dev" for go-install builds. Go's embedded
          # module metadata is the authoritative proof of the selected tag.
          # `|| true`: GitHub Actions runs this under `bash -e -o pipefail`, so
          # a `go version -m` failure (e.g. a stale nfpm shadowing the fresh
          # install on PATH) would otherwise kill the step via pipefail before
          # the `test` comparison below runs at all.
          actual_nfpm_version="$(go version -m "$(command -v nfpm)" | awk '$1 == "mod" && $2 == "github.com/goreleaser/nfpm/v2" { print $3 }' || true)"
          test "$actual_nfpm_version" = "$NFPM_VERSION"

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version="${NSIS_VERSION}" -y --no-progress
          # Chocolatey's package record validates the exact moderated package;
          # Git Bash does not inherit Chocolatey's in-process PATH update. Check
          # the explicit installation path, expose it to this shell, and persist
          # the native path for the later Wails step.
          installed_nsis_version="$(choco list --exact nsis --limit-output | tr -d '\r' | awk -F'|' '$1 == "nsis" { print $2 }')"
          test "$installed_nsis_version" = "$NSIS_VERSION"
          nsis_dir="/c/Program Files (x86)/NSIS"
          test -x "$nsis_dir/makensis.exe"
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          export PATH="$nsis_dir:$PATH"
          command -v makensis >/dev/null

      - name: Run Linux packaging guard tests
        # Mirrors `make package-linux-nfpm`'s wiring: these tests must run
        # before build/bin holds the real release binary, since they back up
        # and stub build/bin/build/packages for the duration of the test and
        # restore them on exit. Placed before the Wails build so there is
        # nothing real to disturb if a step is killed mid-test.
        if: runner.os == 'Linux'
        run: |
          bash scripts/package-version-lib_test.sh
          bash scripts/package-linux_test.sh

      - name: Run macOS packaging guard tests
        # Mirrors `make package-macos`'s wiring; see the Linux step above for
        # why this runs before the real binary exists.
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-version-lib_test.sh
          bash scripts/package-macos_test.sh

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        env:
          GOOS: linux
          GOARCH: amd64
        run: bash scripts/wails-build.sh

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        env:
          GOOS: darwin
          GOARCH: arm64
        run: bash scripts/wails-build.sh

      - name: Wails application build and owned NSIS package (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          # Fail before compilation if source-owned installer branding or its
          # user-data preservation boundary has drifted.
          bash scripts/check-windows-installer-scaffold.sh
          bash scripts/validate-windows-nsis-template.sh
          bash scripts/wails-build.sh
          # project.nsi installs third_party/GO-MODULE-NOTICES.txt; it must
          # cover every Go module this binary links, and none may be DuckDB.
          bash scripts/verify-module-notices.sh build/bin/gopmgr.exe
          # The v3 entrypoint stages pinned macro/bootstrapper inputs around
          # the owned installer. Native lifecycle qualification is a release gate.
          bash scripts/package-windows.sh

      - name: Record SBOM inventory
        # Before the macOS cache cleanup below: the inventory reads the module
        # cache and `go list`. The tool is built now so later steps run offline.
        shell: bash
        run: |
          tool="build/sbom-tool$(go env GOEXE)"
          go build -o "$tool" ./tools/sbom
          case "${{ matrix.platform }}" in
            darwin/arm64) exe=build/bin/gopmgr.app/Contents/MacOS/gopmgr ;;
            linux/amd64) exe=build/bin/gopmgr ;;
            windows/amd64) exe=build/bin/gopmgr.exe ;;
          esac
          "$tool" generate -target "${{ matrix.platform }}" -binary "$exe" \
            -version "${GITHUB_REF_NAME#v}" -commit "$GITHUB_SHA" -inventory-out build/sbom-inventory.json
          echo "GOPMGR_SBOM_TOOL=$tool" >> "$GITHUB_ENV"
          echo "GOPMGR_SBOM_EXE=$exe" >> "$GITHUB_ENV"

      - name: Reclaim macOS packaging space
        if: runner.os == 'macOS'
        run: |
          # The CGO build leaves large Go caches on a hosted runner. The compiled .app no longer needs them, and hdiutil needs
          # free scratch space to copy and compress the staged application.
          df -h /
          go clean -cache -modcache
          npm cache clean --force
          df -h /

      - name: Package Linux (.deb / .rpm)
        if: runner.os == 'Linux'
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-linux.sh

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        # package-macos.sh intentionally takes its non-interactive hdiutil path.
        # create-dmg is a local opt-in and is not installed on the release runner.
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-macos.sh

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p build/packages
          # Consume the exact reviewed output, never an unrelated/stale glob match.
          installer=build/bin/gopmgr-amd64-installer.exe
          if [ ! -s "$installer" ]; then
            echo "release: expected $installer from scripts/package-windows.sh." >&2
            exit 1
          fi
          cp "$installer" "build/packages/GoPMgr-${GITHUB_REF_NAME#v}-amd64-setup.exe"

      - name: Write SBOMs
        # One CycloneDX and one SPDX SBOM per package (docs/SBOM.md). On macOS
        # the executable is read from inside the .dmg, so its hash is that of
        # the shipped bytes; render refuses an executable whose build
        # information differs from the recorded inventory.
        shell: bash
        run: |
          shopt -s nullglob
          packages=(build/packages/*.deb build/packages/*.rpm build/packages/*.dmg build/packages/*.exe)
          test "${#packages[@]}" -gt 0
          for pkg in "${packages[@]}"; do
            exe="$GOPMGR_SBOM_EXE"
            mounted=""
            if [ "${pkg##*.}" = dmg ]; then
              mounted="$(hdiutil attach -nobrowse -readonly -noverify "$pkg" | awk -F'\t' '/\/Volumes\//{print $NF}')"
              exe="$mounted/GoPMgr.app/Contents/MacOS/gopmgr"
            fi
            status=0
            "$GOPMGR_SBOM_TOOL" render -inventory build/sbom-inventory.json -binary "$exe" -artifact "$pkg" -out-dir build/packages || status=$?
            if [ -n "$mounted" ]; then hdiutil detach "$mounted" -quiet; fi
            test "$status" -eq 0
          done

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gopmgr-${{ matrix.os }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publish job checks out the reviewed tag so release classification
      # uses the same tested helper that the source preflight validates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download all installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Sign SBOMs
        # Fails closed once a public key is committed: a missing secret or a
        # key that does not match tools/sbom/signing-key.pub stops the release.
        env:
          GOPMGR_SBOM_PRIVATE_KEY: ${{ secrets.GOPMGR_SBOM_PRIVATE_KEY }}
        run: |
          shopt -s nullglob
          sboms=(dist/*.cdx.json dist/*.spdx.json)
          test "${#sboms[@]}" -gt 0
          if [ -f tools/sbom/signing-key.pub ]; then
            test -n "$GOPMGR_SBOM_PRIVATE_KEY"
            go run ./tools/sbom sign "${sboms[@]}"
            go run ./tools/sbom verify "${sboms[@]}"
          else
            echo "::warning::No SBOM signing key is published (tools/sbom/signing-key.pub); the SBOMs are attached unsigned."
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GOPMGR_UPDATE_PRIVATE_KEY: ${{ secrets.GOPMGR_UPDATE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="$(bash scripts/release-update-channel.sh "$GITHUB_REF_NAME")"
          if [ -n "$GOPMGR_UPDATE_PUBLIC_KEY" ]; then
            test -n "$GOPMGR_UPDATE_PRIVATE_KEY"
            for target in darwin-arm64 windows-amd64; do
              case "$target" in
                darwin-arm64) pattern='*.dmg'; platform=darwin; architecture=arm64 ;;
                windows-amd64) pattern='*.exe'; platform=windows; architecture=amd64 ;;
              esac
              artifact="$(find dist -type f -name "$pattern" -print -quit)"
              test -n "$artifact"
              filename="$(basename "$artifact")"
              go run ./tools/update-manifest \
                -version "$version" -channel "$channel" \
                -platform "$platform" -architecture "$architecture" \
                -artifact "$artifact" \
                -download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$filename" \
                -output "dist/update-$channel-$target.json"
            done
          fi
          publication_flag="$(bash scripts/release-publication-flag.sh "$GITHUB_REF_NAME")"
          publication_args=()
          if [ -n "$publication_flag" ]; then
            publication_args+=("$publication_flag")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GoPMgr $GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            "${publication_args[@]}" \
            dist/*
