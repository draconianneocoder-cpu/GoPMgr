# GitHub Actions CI definition for GoPMgr's Wails v3 migration.
# Validation is local-only; editing this file does not authorize hosted runs.
#
# Successor to the retired GitLab pipeline:
#   verify   -> `make verify` (config + Wails pin + code-map + Go tests + frontend checks): pre-merge gate.
#   build    -> `GOOS=linux GOARCH=amd64 bash scripts/wails-build.sh` smoke build + artifact (GitLab "build" stage).
#   lint     -> golangci-lint + `npm run lint`, blocking.
#   security -> `make memory-scan` (go vet + safety scans), non-blocking (GitLab placeholder stage).
#
# GoPMgr also runs a blocking PAdES generator/evidence-harness regression job
# so release-script failures are caught before a tag invokes release.yml.
#
# `make check-release` is the full local release gate. release.yml reruns it in
# a tag-aware preflight before any tag-triggered installer job can start.
#
# Two clean-checkout facts shape this file:
#   1. The root `gopmgr` package has `//go:embed all:frontend/dist`. `frontend/dist` is
#      gitignored, so it does NOT exist on a fresh checkout — the root package will not
#      compile (test/vet/lint) until the frontend is built. Jobs that compile the root
#      package therefore build the frontend (or stub the embed dir for vet/lint) first.
#   2. Native CGO Linux compilation links GTK 4 and WebKitGTK 6.0.
#      Install their development packages; do not select a legacy backend tag.
#
# Bundled fonts are tracked source assets. The required-font-assets gate
# verifies their identity before compilation; verification does not fetch fonts.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: "1"
  WAILS3: .tmp/wails-v3/bin/wails3

jobs:
  verify:
    name: Verify (config + Wails pin + code-map + Go tests + frontend checks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies (root package links GTK/WebKit)
        run: |
          sudo apt-get update
          # make verify includes source-contract checks implemented with rg.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config ripgrep
          command -v rg >/dev/null

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned Wails v3 CLI
        run: |
          mkdir -p .tmp/wails-v3/bin
          GOBIN="$PWD/.tmp/wails-v3/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Generate actual Wails service bindings
        run: GOPMGR_BINDINGS_PRODUCTION=1 bash scripts/wails-v3-qualification.sh generate

      - name: Build frontend (creates frontend/dist for //go:embed before go test)
        working-directory: frontend
        run: npm run build

      - name: Pre-merge gate (make verify)
        run: make verify

  assurance:
    name: Assurance checks (REUSE + coverage ledger)
    runs-on: macos-15
    # These checks are intentionally separate from `make verify`: the
    # coverage ledger is a Darwin/macOS baseline. A job-level failure blocks the workflow; no step here may
    # be allowed to fail without failing this job. Repository branch protection
    # must require this check separately if it is to block merges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned REUSE
        # The charset-normalizer extra is required, not cosmetic. reuse depends
        # unconditionally on python-magic, a ctypes binding to the *native*
        # libmagic library that pip does not ship; reuse/extract.py tries
        # python-magic, file-magic, charset_normalizer, chardet in that order
        # and raises NoEncodingModuleError at import time if none load. Ubuntu
        # runners preinstall libmagic1, macOS runners do not -- so on this
        # macos-15 job a bare `reuse==6.2.0` makes every reuse invocation exit
        # 1. charset_normalizer is pure Python and needs no system library.
        run: |
          command -v pipx >/dev/null
          pipx install 'reuse[charset-normalizer]==6.2.0'
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned Wails v3 CLI
        run: |
          mkdir -p .tmp/wails-v3/bin
          GOBIN="$PWD/.tmp/wails-v3/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Generate actual Wails service bindings
        run: GOPMGR_BINDINGS_PRODUCTION=1 bash scripts/wails-v3-qualification.sh generate

      - name: Build frontend (creates frontend/dist for //go:embed)
        working-directory: frontend
        run: npm run build

      - name: REUSE license check
        run: make license-check

      - name: Coverage ledger drift check
        run: make coverage-ledger-drift

  pades-harnesses:
    name: PAdES harness regressions
    runs-on: ubuntu-26.04
    # This job is intentionally independent of the Wails/frontend jobs. The
    # generator imports only GoPMgr's signing and PDF packages, while fake
    # veraPDF/DSS tools exercise deterministic parser branches without network
    # downloads or external trust stores.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install local PDF validators
        # qpdf and pdfsig execute against the real generated sample. The
        # regression scripts provide hermetic veraPDF and DSS substitutes for
        # their command/output contracts.
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Download Go modules
        run: go mod download

      - name: Run deterministic PAdES harness tests
        run: make pades-harness-tests

  build:
    name: Build (Wails, linux/amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install pinned Wails v3 CLI
        run: |
          mkdir -p .tmp/wails-v3/bin
          GOBIN="$PWD/.tmp/wails-v3/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # The v3 wrapper generates bindings, installs locked npm dependencies,
      # builds frontend/dist, and compiles the native target in order.
      - name: Wails build
        env:
          GOOS: linux
          GOARCH: amd64
        run: bash scripts/wails-build.sh

      - name: Upload Linux build
        # The build itself is the required signal. Artifact storage is a convenience
        # and can be unavailable when the account-level Actions quota is exhausted.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gopmgr-linux-amd64
          path: build/bin/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    # Required gate: golangci-lint (v2.14.0) + npm run lint. The dependency graph
    # currently resolves golang.org/x/tools v0.51.0, so this passes cleanly;
    # a lint regression now fails the workflow. golangci-lint's own pin must be built
    # with a Go toolchain >= go.mod's `go` directive -- it refuses to run otherwise
    # ("the Go language version used to build golangci-lint is lower than the
    # targeted Go version"). Bumped from v2.13.1 alongside the go.mod bump to
    # Go 1.27.2: under 1.27.2, v2.13.1 and v2.13.2 both fail to type-check
    # ("export data version 5 is greater than maximum supported version 4").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies (golangci-lint type-checks the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for type-check; real assets not needed)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: "golangci-lint (scope: . ./internal/... ./tools/...)"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: . ./internal/... ./tools/...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

  security:
    name: Security scan (non-blocking)
    runs-on: ubuntu-26.04
    # Mirrors GitLab `security` (allow_failure: true), upgraded from a placeholder to a real scan.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails system dependencies (vet compiles the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for go vet; real assets not needed)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: Memory-safety / vet scan (make memory-scan)
        run: make memory-scan

  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-26.04
    # Real, blocking dependency-vulnerability gate. `make memory-scan` only runs
    # govulncheck when it happens to be installed and skips silently otherwise, so
    # nothing actually scanned dependencies in CI before this job. govulncheck does
    # call-graph analysis, so it reports only advisories the build can actually reach.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails system dependencies (govulncheck compiles the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for the build-time analysis)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan default build (govulncheck ./...)
        run: govulncheck ./...
