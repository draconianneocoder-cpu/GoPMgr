# GitHub Actions CI for GoPMgr — Go + Svelte (Wails) desktop application.
#
# Successor to the retired GitLab pipeline:
#   verify   -> `make verify` (config + Wails pin + code-map + Go tests + frontend checks): pre-merge gate.
#   build    -> `wails build -platform linux/amd64` smoke build + artifact (GitLab "build" stage).
#   lint     -> golangci-lint + `npm run lint`, non-blocking (GitLab allow_failure: true).
#   security -> `make memory-scan` (go vet + safety scans), non-blocking (GitLab placeholder stage).
#
# GoPMgr also runs a blocking PAdES generator/evidence-harness regression job
# so release-script failures are caught before a tag invokes release.yml.
#
# `make check-release` is the full local release gate. release.yml reruns it in
# a tag-aware preflight before any tag-triggered installer job can start.
#
# Two clean-checkout facts shape this file:
#   1. The root `gopmgr` package has `//go:embed all:frontend/dist`. `frontend/dist` is
#      gitignored, so it does NOT exist on a fresh checkout — the root package will not
#      compile (test/vet/lint) until the frontend is built. Jobs that compile the root
#      package therefore build the frontend (or stub the embed dir for vet/lint) first.
#   2. The root package links the Wails v2 Linux library. Ubuntu 24.04+ ships
#      WebKit2GTK 4.1, so Linux compile paths use the `webkit2_41` build tag and
#      install libwebkit2gtk-4.1-dev. Wails v2 still links GTK3; GTK4/WebKitGTK
#      6.0 requires a later Wails migration.
#
# Bundled fonts are fetched over the network and degrade gracefully (the app falls back to
# core fonts), so font fetching is never a hard gate here — only release embeds them.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: "1"

jobs:
  verify:
    name: Verify (config + Wails pin + code-map + Go tests + frontend checks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies (root package links GTK/WebKit)
        run: |
          sudo apt-get update
          # make verify includes source-contract checks implemented with rg.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config ripgrep
          command -v rg >/dev/null

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (creates frontend/dist for //go:embed before go test)
        working-directory: frontend
        run: npm run build

      - name: Pre-merge gate (make verify)
        run: make verify

  assurance:
    name: Assurance checks (REUSE + coverage ledger)
    runs-on: macos-15
    # These checks are intentionally separate from `make verify`: the
    # coverage ledger is a Darwin/macOS baseline and includes a DuckDB-tagged
    # analytics pass. A job-level failure blocks the workflow; no step here may
    # be allowed to fail without failing this job. Repository branch protection
    # must require this check separately if it is to block merges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned REUSE
        run: |
          brew install pipx
          pipx install reuse==6.2.0
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (creates frontend/dist for //go:embed)
        working-directory: frontend
        run: npm run build

      - name: REUSE license check
        run: make license-check

      - name: Coverage ledger drift check
        run: make coverage-ledger-drift

  pades-harnesses:
    name: PAdES harness regressions
    runs-on: ubuntu-26.04
    # This job is intentionally independent of the Wails/frontend jobs. The
    # generator imports only GoPMgr's signing and PDF packages, while fake
    # veraPDF/DSS tools exercise deterministic parser branches without network
    # downloads or external trust stores.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install local PDF validators
        # qpdf and pdfsig execute against the real generated sample. The
        # regression scripts provide hermetic veraPDF and DSS substitutes for
        # their command/output contracts.
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Download Go modules
        run: go mod download

      - name: Run deterministic PAdES harness tests
        run: make pades-harness-tests

  build:
    name: Build (Wails, linux/amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Wails runs `npm install` + `npm run build` itself, creating frontend/dist before
      # compiling Go, so no separate frontend build step is needed here.
      - name: Wails build
        run: wails build -platform linux/amd64 -tags duckdb,webkit2_41

      - name: Upload Linux build
        # The build itself is the required signal. Artifact storage is a convenience
        # and can be unavailable when the account-level Actions quota is exhausted.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gopmgr-linux-amd64
          path: build/bin/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    # Required gate: golangci-lint (v2.13.1) + npm run lint. The dependency graph
    # currently resolves golang.org/x/tools v0.49.0, so this passes cleanly;
    # a lint regression now fails the workflow. golangci-lint's own pin must be built
    # with a Go toolchain >= go.mod's `go` directive -- it refuses to run otherwise
    # ("the Go language version used to build golangci-lint is lower than the
    # targeted Go version"). Bumped from v2.12.2 (published 2026-05-06, months
    # before Go 1.27.0 existed) alongside the go.mod bump to Go 1.27.0.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies (golangci-lint type-checks the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for type-check; real assets not needed)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: "golangci-lint (scope: . ./internal/...)"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --build-tags=webkit2_41 . ./internal/...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

  security:
    name: Security scan (non-blocking)
    runs-on: ubuntu-26.04
    # Mirrors GitLab `security` (allow_failure: true), upgraded from a placeholder to a real scan.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails system dependencies (vet compiles the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for go vet; real assets not needed)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: Memory-safety / vet scan (make memory-scan)
        run: make memory-scan

  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-26.04
    # Real, blocking dependency-vulnerability gate. `make memory-scan` only runs
    # govulncheck when it happens to be installed and skips silently otherwise, so
    # nothing actually scanned dependencies in CI before this job. govulncheck does
    # call-graph analysis, so it reports only advisories the build can actually reach.
    # If a pre-existing advisory surfaces on first run, patch the dependency (preferred)
    # or temporarily add `continue-on-error: true` here while the fix is prepared.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails system dependencies (govulncheck compiles the root package)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Stub embedded frontend (satisfies //go:embed for the build-time analysis)
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan default build (govulncheck ./...)
        run: govulncheck -tags webkit2_41 ./...

      - name: Scan DuckDB analytics engine (-tags duckdb)
        run: govulncheck -tags duckdb,webkit2_41 ./internal/analytics/...

  analytics-duckdb:
    name: Analytics engine (-tags duckdb)
    runs-on: ubuntu-26.04
    # Builds and tests the optional DuckDB analytics engine so it can't bitrot.
    # internal/analytics imports duckdb-go (CGO) but not Wails, so no GTK/WebKit
    # is needed; the default-build jobs above never link DuckDB.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build + test the DuckDB analytics engine
        run: go test -tags duckdb ./internal/analytics/...
