#
# ADR-012 DF0 Rust workspace. Isolated from the GoPMgr build. Versions are
# pinned exactly here and by the committed Cargo.lock (DF-A13).

[workspace]
resolver = "3"
members = ["engine", "cli", "worker"]
exclude = ["codegen"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Only the features GoPMgr's formats need: no avro, no remote object stores,
# no encryption, no backtraces.
datafusion = { version = "=55.2.0", default-features = false, features = ["parquet", "compression", "sql", "recursive_protection", "nested_expressions"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
# DF0-C worker transport: gRPC client only (no server, no TLS, no TCP
# connector is used), over a Unix socket.
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = { version = "=0.14.6", default-features = false }
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tokio-stream = { version = "=0.1.19", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["std"] }
libc = { version = "=0.2.191", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }

[profile.release]
debug = 0
lto = "thin"
codegen-units = 4

# Temporary DF0-only source overrides; provenance/removal: ../third_party/GOPMGR.md.
[patch.crates-io]
datafusion = { path = "../third_party/datafusion-55.2.0" }
datafusion-datasource = { path = "../third_party/datafusion-datasource-55.2.0" }
arrow-ipc = { path = "../third_party/arrow-ipc-59.3.2" }
parquet = { path = "../third_party/parquet-59.3.2" }
